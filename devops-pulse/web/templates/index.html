{{define "index.html"}}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Pulse</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-2">
  <header class="navbar border-bottom border-subtle py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-semibold" href="/">DevOps Pulse</a>
      <span class="fg-3 small">operations / live telemetry</span>
    </div>
  </header>
  <main class="container py-5" x-data="pulseDashboard" hx-ext="sse" sse-connect="/metrics" @pulse-toggled.document="notify($event.detail)">
    <section class="pulse-heading mb-4">
      <div>
        <p class="eyebrow fg-3 mb-2">Control room</p>
        <h1 class="fs-4xl mb-2">Service health, without the noise.</h1>
        <p class="fg-3 mb-0">A live view of the systems keeping your delivery moving.</p>
      </div>
      <span class="badge rounded-pill" :class="connected ? 'theme-success' : 'theme-warning'" x-text="connected ? 'Live' : 'Reconnecting'">Reconnecting</span>
    </section>
    <section class="toolbar card border-subtle mb-4">
      <div class="card-body d-flex flex-wrap gap-3 align-items-center">
        <label class="visually-hidden" for="service-search">Filter services</label>
        <div class="input-group search-box">
          <span class="input-group-text">⌕</span>
          <input id="service-search" class="form-control" type="search" placeholder="Filter services" x-model="query">
        </div>
        <span class="fg-3 small">Updates every 2 seconds</span>
      </div>
    </section>
    <div id="metrics-grid" class="row g-7" sse-swap="metrics" hx-swap="none">
      {{template "server-grid" .}}
    </div>
  </main>
  {{template "logs-dialog" .}}
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/htmx-ext-sse.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>{{end}}
