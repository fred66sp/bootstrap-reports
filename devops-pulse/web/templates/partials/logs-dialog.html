{{define "logs-dialog"}}<dialog id="logs-dialog" class="dialog dialog-lg dialog-slide-up">
  <div class="dialog-header"><h2 class="dialog-title" id="logs-title">{{index .Messages "logs fallback title"}}</h2><button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="{{index .Messages "close"}}"></button></div>
  <div class="dialog-body" id="logs-body"></div>
  <div class="dialog-footer"><button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">{{index .Messages "close"}}</button></div>
</dialog>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="pulse-toast" class="toast" role="status" aria-live="polite"><div class="toast-header"><strong class="me-auto">{{index .Messages "toast header"}}</strong><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="{{index .Messages "close"}}"></button></div><div class="toast-body" id="pulse-toast-body"></div></div></div>{{end}}
